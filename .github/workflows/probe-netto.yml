name: Netto-Test (temporär)
on:
  push:
    branches: [netto-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probe
        run: |
          cat > p.mjs <<'JS'
          const UA = { 'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1', 'Accept-Language': 'de-DE' };
          async function t(url, opts = {}) {
            try {
              const r = await fetch(url, { headers: { ...UA, ...(opts.headers || {}) }, redirect: 'follow' });
              const txt = await r.text();
              console.log('\n###', r.status, url, '->', r.url, txt.length);
              console.log(txt.slice(0, opts.n || 600).replace(/\s+/g, ' '));
              return txt;
            } catch (e) { console.log('\n###', url, 'ERR', e.message); return ''; }
          }
          const ctx = (txt, re, n = 250) => { const out = []; let m; const r = new RegExp(re, 'gi'); while ((m = r.exec(txt)) && out.length < 6) out.push(txt.slice(Math.max(0, m.index - n), m.index + n).replace(/\s+/g, ' ')); return out; };
          const base = 'https://www.netto-online.de/INTERSHOP/web/WFS/Plus-NettoDE-Site/de_DE/-/EUR/';
          const sf = await t(base + 'ViewMMPStoreFinder-GetStoreItems?n=51.80&e=7.50&s=51.74&w=7.38', { n: 0, headers: { 'X-Requested-With': 'XMLHttpRequest', Accept: 'application/json' } });
          console.log('SF ctx:', ctx(sf, 'Olfener', 400));
          const id = (ctx(sf, 'Olfener', 600).join(' ').match(/"(?:store_id|storeId|id|StoreID|store_no)"\s*:\s*"?(\d{3,6})/i) || [])[1];
          console.log('STORE ID', id);
          if (id) {
            const pr = await t('https://www.netto-online.de/ueber-netto/Online-Prospekte.chtm/' + id, { n: 0 });
            console.log('prospekt links:', [...new Set(pr.match(/https?:[^"' ]*(blaetter|catalog|flipbook|prospekt\.|media-central|leaflet|\.pdf)[^"' ]*/gi) || [])].slice(0, 15));
            const fa = await t('https://www.netto-online.de/filialangebote?storeId=' + id, { n: 0, headers: { Cookie: 'netto_user_stores_id=' + id + '; StoreId=' + id } });
            console.log('offers-ish:', ctx(fa, 'class="product|data-product|€', 150).slice(0, 4));
            console.log('fa links:', [...new Set(fa.match(/https:\/\/www\.netto-online\.de\/INTERSHOP[^"' ]*(Offer|Angebot)[^"' ]*/gi) || [])].slice(0, 10));
          }
          JS
          node p.mjs
