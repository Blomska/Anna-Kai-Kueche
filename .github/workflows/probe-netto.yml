name: Netto-Test (temporär)
on:
  push:
    branches: [netto-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probe
        run: |
          cat > p.mjs <<'JS'
          const UA = { 'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1', 'Accept-Language': 'de-DE' };
          async function t(url, opts = {}) {
            try {
              const r = await fetch(url, { headers: { ...UA, ...(opts.headers || {}) }, redirect: 'follow' });
              const txt = await r.text();
              console.log('\n###', r.status, url, '->', r.url, txt.length);
              console.log(txt.slice(0, opts.n || 600).replace(/\s+/g, ' '));
              return txt;
            } catch (e) { console.log('\n###', url, 'ERR', e.message); return ''; }
          }
          const ctx = (txt, re, n = 250) => { const out = []; let m; const r = new RegExp(re, 'gi'); while ((m = r.exec(txt)) && out.length < 6) out.push(txt.slice(Math.max(0, m.index - n), m.index + n).replace(/\s+/g, ' ')); return out; };
          const base = 'https://www.netto-online.de/INTERSHOP/web/WFS/Plus-NettoDE-Site/de_DE/-/EUR/ViewMMPStoreFinder-GetStoreItems';
          const q = 's=51.74&n=51.80&w=7.38&e=7.50&netto=true&city=&service=&beverage=&nonfood=';
          for (const [m, url, body] of [['GET', base + '?' + q, undefined], ['POST', base, q]]) {
            try {
              const r = await fetch(url, { method: m, body, headers: { ...UA, 'X-Requested-With': 'XMLHttpRequest', Accept: 'application/json, text/javascript, */*', 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8', Referer: 'https://www.netto-online.de/filialfinder' } });
              const x = await r.text();
              console.log('\n###', m, r.status, x.length, x.slice(0, 1500));
              const id = (ctx(x, 'Olfener', 800).join(' ').match(/"store_id"\s*:\s*"?(\w+)/i) || [])[1];
              console.log('OLFENER', ctx(x, 'Olfener', 500).slice(0, 1));
              if (id) {
                const pr = await t('https://www.netto-online.de/ueber-netto/Online-Prospekte.chtm/' + id, { n: 0 });
                console.log('prospekt links:', [...new Set(pr.match(/https?:[^"' <>]*(blaetter|catalog|flip|prospekt|media-central|leaflet|\.pdf|publitas|yumpu|issuu)[^"' <>]*/gi) || [])].slice(0, 25));
                break;
              }
            } catch (e) { console.log(m, 'ERR', e.message); }
          }
          JS
          node p.mjs
