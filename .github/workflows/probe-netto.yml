name: Netto-Test (temporär)
on:
  push:
    branches: [netto]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/update-prospekte.mjs
      - run: |
          node -e "const d=require('./data/prospekte.json');const n=d.netto;console.log(JSON.stringify(n.current,null,1));console.log(n.offers?.groups);console.log(n.offers?.offers?.length);console.log(JSON.stringify(n.offers?.offers?.slice(0,3),null,1));const g={};n.offers?.offers?.forEach(o=>g[o.group]=(g[o.group]||0)+1);console.log(g)"
