name: Netto-Test (temporär)
on:
  push:
    branches: [netto-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probe
        run: |
          cat > p.mjs <<'JS'
          const UA = { 'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1', 'Accept-Language': 'de-DE' };
          async function t(url, opts = {}) {
            try {
              const r = await fetch(url, { headers: { ...UA, ...(opts.headers || {}) }, redirect: 'follow' });
              const txt = await r.text();
              console.log('\n###', r.status, url, '->', r.url, txt.length);
              console.log(txt.slice(0, opts.n || 600).replace(/\s+/g, ' '));
              return txt;
            } catch (e) { console.log('\n###', url, 'ERR', e.message); return ''; }
          }
          const ctx = (txt, re, n = 250) => { const out = []; let m; const r = new RegExp(re, 'gi'); while ((m = r.exec(txt)) && out.length < 6) out.push(txt.slice(Math.max(0, m.index - n), m.index + n).replace(/\s+/g, ' ')); return out; };
          const id = '6061';
          const pr = await t('https://www.netto-online.de/ueber-netto/Online-Prospekte.chtm/' + id, { n: 0 });
          console.log('prospekt links:', [...new Set(pr.match(/https?:[^"' <>()]*(blaetter|catalog|flip|media-central|leaflet|\.pdf|publitas|yumpu|issuu|bonial|prospekt)[^"' <>()]*/gi) || [])].slice(0, 30));
          console.log('prospekt ctx:', ctx(pr, 'data-(?:url|src|catalog|prospekt)', 200).slice(0, 4));
          for (const u of ['https://www.netto-online.de/filialangebote/' + id, 'https://www.netto-online.de/filialangebote?storeId=' + id, 'https://www.netto-online.de/filialangebote?StoreID=' + id]) {
            const fa = await t(u, { n: 0 });
            const prods = fa.match(/class="[^"]*product[^"]*"/g) || [];
            console.log(u, 'product-classes', prods.length, 'Olfener?', /Olfener/.test(fa), 'prices', (fa.match(/\d+[.,]\d{2}\s*(€|&euro;)/g) || []).length);
            console.log('names:', [...new Set(fa.match(/class="product__title[^"]*"[^>]*>[^<]{3,80}/g) || [])].slice(0, 8));
            console.log('ajax:', [...new Set(fa.match(/https:\/\/www\.netto-online\.de\/INTERSHOP\/web[^"' ]*/g) || [])].filter((x) => /Offer|Angebot|Product|Catalog/i.test(x)).slice(0, 12));
          }
          JS
          node p.mjs
