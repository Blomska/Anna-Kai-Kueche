name: Netto-Test (temporär)
on:
  push:
    branches: [netto-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Probe
        run: |
          cat > p.mjs <<'JS'
          const UA = { 'User-Agent': 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1', 'Accept-Language': 'de-DE' };
          async function t(url, opts = {}) {
            try {
              const r = await fetch(url, { headers: { ...UA, ...(opts.headers || {}) }, redirect: 'follow' });
              const txt = await r.text();
              console.log('\n###', r.status, url, '->', r.url, txt.length);
              console.log(txt.slice(0, opts.n || 600).replace(/\s+/g, ' '));
              return txt;
            } catch (e) { console.log('\n###', url, 'ERR', e.message); return ''; }
          }
          const ctx = (txt, re, n = 250) => { const out = []; let m; const r = new RegExp(re, 'gi'); while ((m = r.exec(txt)) && out.length < 6) out.push(txt.slice(Math.max(0, m.index - n), m.index + n).replace(/\s+/g, ' ')); return out; };
          const id = '6061';
          const jar = new Map();
          const keep = (r) => { for (const c of r.headers.getSetCookie?.() || []) { const [kv] = c.split(';'); const i = kv.indexOf('='); jar.set(kv.slice(0, i), kv.slice(i + 1)); } };
          const cookie = () => [...jar].map(([k, v]) => `${k}=${v}`).join('; ');
          const go = async (url, opts = {}) => { const r = await fetch(url, { redirect: 'manual', ...opts, headers: { ...UA, Cookie: cookie(), ...(opts.headers || {}) } }); keep(r); return r; };
          let r = await go('https://www.netto-online.de/filialfinder');
          const ff = await r.text();
          const tok = (ff.match(/SynchronizerToken["']?\s*[:=]\s*["']?([a-f0-9]{20,})/i) || ff.match(/name="SynchronizerToken"\s+value="([^"]+)"/) || [])[1];
          const setPath = (ff.match(/storefinderSetID:\s*"([^"]+)"/) || [])[1];
          console.log('cookies', [...jar.keys()], 'token', tok, 'setPath', setPath, ctx(ff, 'SyncToken|SynchronizerToken', 120).slice(0, 2));
          if (setPath) {
            r = await go(setPath, { method: 'POST', body: `StoreID=${id}${tok ? `&SynchronizerToken=${tok}` : ''}`, headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8', 'X-Requested-With': 'XMLHttpRequest' } });
            console.log('set', r.status, (await r.text()).slice(0, 300));
          }
          r = await go('https://www.netto-online.de/filialangebote');
          let fa = await r.text();
          if (r.status >= 300 && r.status < 400) { r = await go(new URL(r.headers.get('location'), 'https://www.netto-online.de').href); fa = await r.text(); }
          console.log('FA', r.status, fa.length, 'Olfener?', /Olfener|6061/.test(fa), 'prices', (fa.match(/\d+[.,]\d{2}\s*(€|&euro;)/g) || []).length);
          console.log('tiles:', ctx(fa, 'product[-_]?(tile|title|name)', 160).slice(0, 4));
          const pr2 = await (await go('https://www.netto-online.de/ueber-netto/Online-Prospekte.chtm')).text();
          console.log('flipbooks:', [...new Set(pr2.match(/https?:[^"' <>()]*flipbook[^"' <>()]*/gi) || [])].slice(0, 6), ctx(pr2, 'data-catalog|flipbook', 200).slice(0, 3));
          JS
          node p.mjs
