# Veröffentlicht den Küchenhelfer (worker/) als Cloudflare Worker "anna-kai-helfer".
#
# Einmalig einrichten (GitHub → Settings → Secrets and variables → Actions):
#   GEMINIAPIKEYANNA       – eigener Gemini-Schlüssel für Anna & Kai (aistudio.google.com)
#   CLOUDFLARE_API_TOKEN   – Cloudflare-API-Token ("Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID  – Cloudflare-Konto-ID
#   FAMILY_CODE            – frei gewählter Zugangscode für den Helfer
#
# Die Namen dürfen auch ohne Unterstriche geschrieben sein (z. B. CLOUDFLAREAPITOKEN).
name: Chat-Helfer veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/chat-helfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prüfen, ob Cloudflare eingerichtet ist
        id: check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAREAPITOKEN }}
        run: |
          if [ -n "$CF_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN fehlt – Chat-Helfer wird übersprungen (siehe README)."
          fi

      - name: Code holen
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Node einrichten
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        if: steps.check.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund

      - name: Worker veröffentlichen
        if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLAREAPITOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLAREACCOUNTID }}
          wranglerVersion: '4.166.0'
          workingDirectory: worker
          secrets: |
            GEMINI_API_KEY
            FAMILY_CODE
        env:
          # Eigenes Kontingent von Anna & Kai – NICHT das von Mama-Einkauf
          GEMINI_API_KEY: ${{ secrets.GEMINIAPIKEYANNA || secrets.GEMINI_API_KEY }}
          FAMILY_CODE: ${{ secrets.FAMILY_CODE || secrets.FAMILYCODE }}
